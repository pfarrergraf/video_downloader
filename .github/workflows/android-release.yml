name: Android candidate build

# Deliberately manual: an AAB or Play upload must be built from the explicitly
# selected ref, never from an incidental tag or feature-branch push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.2.0 (leading 'v' optional)"
        required: true
        type: string
      fgs_declaration_confirmed:
        description: "Record whether the Play foreground-service declaration is already confirmed (promotion still gates it)"
        required: true
        default: false
        type: boolean
      team_gate_confirmed:
        description: "All release roles recorded ACK for this exact commit"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # The workflow is dispatched from the intended branch; normalize a missing
  # leading v so the version parser still receives its canonical tag shape.
  RELEASE_TAG: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

jobs:
  # Both the tag shape and the versionCode monotonicity used to be checked
  # inside build-signed-release, i.e. only after build-ffmpeg and build-quickjs
  # had cross-compiled for four minutes. A typo'd version therefore cost a full
  # NDK build before erroring out (run #49). Everything that can be decided
  # from the tag alone happens here first instead.
  validate-version:
    runs-on: ubuntu-latest
    environment: android-candidate-signing
    outputs:
      release_tag: ${{ steps.candidate_version.outputs.release_tag }}
      version_name: ${{ steps.candidate_version.outputs.version_name }}
      version_code: ${{ steps.candidate_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up build-time Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Require TEAM candidate gate
        shell: bash
        run: |
          [ "${{ inputs.team_gate_confirmed }}" = "true" ] || {
            echo "::error::The commit-bound TEAM gate must be confirmed before candidate build."
            exit 1
          }
          [ "$GITHUB_REPOSITORY" = "pfarrergraf/video_downloader" ] || {
            echo "::error::Candidate signing is restricted to the canonical repository."
            exit 1
          }
          [ "$GITHUB_REF_NAME" = "release/v1.0.4.2-team" ] || {
            echo "::error::Candidate must be dispatched from release/v1.0.4.2-team."
            exit 1
          }
          jq -e '
            .schemaVersion == 1
            and .releaseLine == "1.0.4"
            and (.roles | length) == 6
            and ([.roles[]] | all(. == "ACK"))
          ' docs/releases/1.0.4.2/TEAM_GATE.json >/dev/null || {
            echo "::error::Machine-readable TEAM gate is not fully ACK."
            exit 1
          }

      - name: Confirm the no-advertising dependency and source gate
        run: python scripts/check_no_ad_sdk.py

      - name: Select the first free revision on the requested release line
        id: candidate_version
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY }}
        shell: bash
        run: |
          result="$(node scripts/upload_google_play.mjs --query-highest-version-code true --package de.classydl.app)"
          highest="$(printf '%s' "$result" | jq -r '.highestVersionCode')"
          python scripts/select_android_candidate_version.py "$RELEASE_TAG" "$highest" \
            --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
          echo "Google Play highest versionCode: $highest" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject a non-monotone versionCode
        shell: bash
        run: |
          metadata="$(curl --fail --silent --location https://github.com/pfarrergraf/video_downloader/releases/latest/download/DownloadThat-release.json || true)"
          if [ -n "$metadata" ]; then
            previous="$(printf '%s' "$metadata" | python -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')"
            previous_tag="$(printf '%s' "$metadata" | python -c 'import json,sys; print(json.load(sys.stdin).get("releaseTag", ""))')"
            if (( VERSION_CODE < previous )) || { (( VERSION_CODE == previous )) && [ "$RELEASE_TAG" != "$previous_tag" ]; }; then
              echo "::error::versionCode $VERSION_CODE (from $RELEASE_TAG) must exceed the released $previous ($previous_tag)."
              exit 1
            fi
            if (( VERSION_CODE == previous )); then
              echo "Retrying the existing $RELEASE_TAG release after an external publishing failure."
            fi
          fi
          echo "$RELEASE_TAG -> versionName=$VERSION_NAME versionCode=$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

  build-ffmpeg:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          "$SDKMANAGER" --install "ndk;27.0.12077973"

      # Release ships arm64-v8a only (see build.gradle's abiFilterList) — no
      # need to also cross-compile the x86_64 ffmpeg binary that only exists
      # for the debug/emulator-smoke-test path in android-build.yml.
      - name: Build ffmpeg for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bash .github/scripts/build_ffmpeg_android.sh "arm64-v8a" "$PWD/ffmpeg-out"

      - name: Upload ffmpeg binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-arm64-v8a
          path: ffmpeg-out/bin/ffmpeg
          retention-days: 1

  build-quickjs:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          "$SDKMANAGER" --install "ndk;27.0.12077973"
      - name: Build QuickJS for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bash .github/scripts/build_quickjs_android.sh "arm64-v8a" "$PWD/quickjs-out"
      - name: Upload QuickJS binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickjs-arm64-v8a
          path: quickjs-out/bin/qjs
          retention-days: 1

  build-signed-release:
    needs: [validate-version, build-ffmpeg, build-quickjs]
    runs-on: ubuntu-latest
    environment: android-candidate-signing
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    env:
      RELEASE_TAG: ${{ needs.validate-version.outputs.release_tag }}
      VERSION_NAME: ${{ needs.validate-version.outputs.version_name }}
      VERSION_CODE: ${{ needs.validate-version.outputs.version_code }}
      PLAY_STORE_URL: ${{ vars.PLAY_STORE_URL || 'https://play.google.com/store/apps/details?id=de.classydl.app' }}
      LICENSE_API_BASE_URL: ${{ vars.LICENSE_API_BASE_URL || 'https://downloadthat.app' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # check_android_release_artifacts.sh needs apksigner/zipalign (build-tools),
      # which setup-android doesn't install by default - only cmdline-tools and
      # platform-tools. The version is PINNED on purpose: picking "whatever is
      # newest on the runner" once silently jumped 36.0.0 -> 37.0.0, which
      # renamed apksigner's --print-certs output and produced a false
      # "Direct APK signing certificate mismatch" (2026-08-26). See CLAUDE.md.
      - name: Install build-tools (apksigner, zipalign)
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          "$SDKMANAGER" --install "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up build-time Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.13"
          # Published APK/AAB artifacts must not depend on a writable cache
          # that an untrusted branch could have populated.
          cache-disabled: true

      - name: Download ffmpeg binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-arm64-v8a
          path: android/ffmpeg-artifacts/ffmpeg-arm64-v8a
      - name: Download QuickJS binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quickjs-arm64-v8a
          path: android/quickjs-artifacts/quickjs-arm64-v8a

      - name: Place runtime binaries into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp ffmpeg-artifacts/ffmpeg-arm64-v8a/ffmpeg app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          cp quickjs-artifacts/quickjs-arm64-v8a/qjs app/src/main/jniLibs/arm64-v8a/libqjs.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libqjs.so

      - name: Verify app-signing and upload-key secrets are configured
        env:
          ANDROID_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_APP_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ANDROID_APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
          ANDROID_APP_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          missing=()
          for name in \
            ANDROID_APP_SIGNING_KEYSTORE_BASE64 \
            ANDROID_APP_SIGNING_KEYSTORE_PASSWORD \
            ANDROID_APP_SIGNING_KEY_ALIAS \
            ANDROID_APP_SIGNING_KEY_PASSWORD \
            ANDROID_APP_SIGNING_CERT_SHA256 \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD \
            ANDROID_UPLOAD_CERT_SHA256; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required Android release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      # Second gate: validate-version already rejected a non-monotone code
      # before anything was built, but another release can land in between, and
      # this is the last point before artifacts get signed and published.
      - name: Reject a non-monotone versionCode
        shell: bash
        run: |
          metadata="$(curl --fail --silent --location https://github.com/pfarrergraf/video_downloader/releases/latest/download/DownloadThat-release.json || true)"
          if [ -n "$metadata" ]; then
            previous="$(printf '%s' "$metadata" | python -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')"
            previous_tag="$(printf '%s' "$metadata" | python -c 'import json,sys; print(json.load(sys.stdin).get("releaseTag", ""))')"
            (( VERSION_CODE > previous )) || { (( VERSION_CODE == previous )) && [ "$RELEASE_TAG" = "$previous_tag" ]; } || {
              echo "versionCode $VERSION_CODE ($RELEASE_TAG) must exceed released $previous ($previous_tag)"
              exit 1
            }
          fi

      - name: Build signed Direct APK (arm64-v8a only)
        env:
          ANDROID_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_APP_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_APP_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          ANDROID_APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDirectRelease -PabiFilters=arm64-v8a -PplayStoreUrl="$PLAY_STORE_URL" -PlicenseApiBaseUrl="$LICENSE_API_BASE_URL" \
            -PversionNameOverride="$VERSION_NAME" -PversionCodeOverride="$VERSION_CODE" --stacktrace

      # Play Console requires the .aab (App Bundle) format, not a raw APK. CI
      # signs this artifact with the separately revocable upload key; Google
      # verifies it and re-signs delivered APKs with the transferred app-signing
      # key. Never substitute the app-signing keystore here.
      # Not attached to the GitHub Release (that's for direct/sideload
      # installs); this is a separate build artifact for manual upload to
      # Play Console during testing-track setup.
      - name: Build signed Play App Bundle (arm64-v8a only)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          gradle :app:bundlePlayRelease -PabiFilters=arm64-v8a -PplayStoreUrl="$PLAY_STORE_URL" -PlicenseApiBaseUrl="$LICENSE_API_BASE_URL" \
            -PversionNameOverride="$VERSION_NAME" -PversionCodeOverride="$VERSION_CODE" --stacktrace

      - name: Verify signatures, 16 KiB native compatibility and store separation
        env:
          EXPECTED_APP_SIGNING_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
          EXPECTED_UPLOAD_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: bash ../.github/scripts/check_android_release_artifacts.sh app/build/outputs/apk/direct/release/app-direct-release.apk app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Reject non-runtime files in the Android Python bundle
        run: python ../scripts/check_android_python_sources.py app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Generate Android CycloneDX SBOM
        run: |
          gradle :app:dependencies --configuration playReleaseRuntimeClasspath > play-release-dependencies.txt
          python ../scripts/gradle_dependencies_to_cyclonedx.py play-release-dependencies.txt DownloadThat-android-sbom.cdx.json

      - name: Package immutable candidate and provenance
        env:
          EXPECTED_UPLOAD_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-out
          candidate="candidate-out/DownloadThat-${RELEASE_TAG}-play.aab"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$candidate"
          cp DownloadThat-android-sbom.cdx.json candidate-out/DownloadThat-android-sbom.cdx.json
          aab_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          cert_sha="$(keytool -printcert -jarfile "$candidate" | awk -F': ' '/SHA256:/{print $2; exit}' | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          expected_cert="$(printf '%s' "$EXPECTED_UPLOAD_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          [ "$cert_sha" = "$expected_cert" ] || { echo "Upload certificate mismatch during provenance generation"; exit 1; }
          board_sha="$(sha256sum ../docs/releases/1.0.4.2/RELEASE_BOARD.md | awk '{print $1}')"
          gate_sha="$(sha256sum ../docs/releases/1.0.4.2/TEAM_GATE.json | awk '{print $1}')"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > candidate-out/candidate-provenance.json <<JSON
          {
            "schemaVersion": 1,
            "packageName": "de.classydl.app",
            "releaseTag": "${RELEASE_TAG}",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "commitSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "artifactName": "DownloadThat-${RELEASE_TAG}-play-candidate",
            "aabFile": "DownloadThat-${RELEASE_TAG}-play.aab",
            "aabSha256": "${aab_sha}",
            "uploadCertificateSha256": "${cert_sha}",
            "releaseBoardSha256": "${board_sha}",
            "teamGateSha256": "${gate_sha}",
            "fgsDeclarationConfirmed": ${{ inputs.fgs_declaration_confirmed }},
            "teamGateConfirmed": true,
            "generatedAt": "${generated_at}"
          }
          JSON
          sha256sum candidate-out/* > candidate-out/SHA256SUMS
          echo "Candidate AAB SHA-256: $aab_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DownloadThat-${{ env.RELEASE_TAG }}-play-candidate
          path: android/candidate-out/
          if-no-files-found: error
          retention-days: 30

      - name: Package signed Direct APK
        env:
          EXPECTED_APP_SIGNING_SHA256: ${{ secrets.ANDROID_APP_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p direct-out
          apk="direct-out/DownloadThat-${RELEASE_TAG}-direct.apk"
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "$apk"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          # Loose label match + last field: apksigner 37.0.0 renamed this line
          # from "Signer #1 certificate ..." to "V2 Signer: certificate ...".
          cert_sha="$(apksigner verify --print-certs "$apk" | awk -F': ' '/certificate SHA-256 digest/{print $NF; exit}' | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          [ -n "$cert_sha" ] || { echo "Could not parse a signing certificate from $apk"; exit 1; }
          expected_cert="$(printf '%s' "$EXPECTED_APP_SIGNING_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':')"
          [ "$cert_sha" = "$expected_cert" ] || { echo "App-signing certificate mismatch during Direct packaging"; exit 1; }
          cat > direct-out/direct-provenance.json <<JSON
          {
            "schemaVersion": 1,
            "packageName": "de.classydl.app",
            "releaseTag": "${RELEASE_TAG}",
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "commitSha": "${GITHUB_SHA}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "apkFile": "DownloadThat-${RELEASE_TAG}-direct.apk",
            "apkSha256": "${apk_sha}",
            "appSigningCertificateSha256": "${cert_sha}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          sha256sum direct-out/*.apk direct-out/direct-provenance.json > direct-out/SHA256SUMS
          echo "Direct APK SHA-256: $apk_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Direct APK package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DownloadThat-${{ env.RELEASE_TAG }}-direct-apk
          path: android/direct-out/
          if-no-files-found: error
          retention-days: 30

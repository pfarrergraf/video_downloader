name: Playlist canary

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/playlist-canary.yml"
      - "scripts/playlist_canary.py"
      - "video_downloader/playlist_urls.py"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional newline-separated playlist URLs"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: playlist-canary
  cancel-in-progress: true

jobs:
  extract-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASSYDL_CANARY_URLS: ${{ inputs.urls }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Python dependencies
        run: uv sync --extra dev
      - name: Run non-destructive playlist canary
        run: uv run python scripts/playlist_canary.py --playlist-end 10 --min-items 1

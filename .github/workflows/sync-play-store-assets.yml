name: Sync Google Play store assets

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: google-play-store-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: play-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Enforce public claims policy
        run: python scripts/check_public_claims.py
      - name: Replace feature graphics and phone screenshots for every listing language
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/upload_google_play.mjs --sync-assets true --package de.classydl.app --asset-dir store_assets
      # Runs as a second, independent edit right after the step above. It
      # deletes and replaces whatever phone screenshots that step just set,
      # this time with each listing language's own localized home screen
      # (light then dark) instead of the same 3 English screenshots for
      # every language — the feature graphics the step above uploaded are
      # untouched. That re-upload-then-replace is a little redundant but
      # harmless; kept separate deliberately so this step can't regress the
      # feature-graphic sync above if it ever needs to change on its own.
      - name: Replace phone screenshots with each listing language's own localized screenshot
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: node scripts/upload_google_play.mjs --sync-locale-screenshots true --package de.classydl.app --screenshots-dir store_assets/screenshots

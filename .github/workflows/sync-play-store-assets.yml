name: Sync Google Play store assets

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: google-play-store-assets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: play-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Enforce public claims policy
        run: python scripts/check_public_claims.py
      - name: Dry-run phone, 7-inch and 10-inch screenshot assignments
        run: >-
          node scripts/upload_google_play.mjs
          --sync-screenshot-assets true
          --package de.classydl.app
          --locale-matrix store_assets/play_locale_matrix.json
          --phone-dir store_assets/captures/phone
          --seven-inch-dir store_assets/captures/7-inch
          --ten-inch-dir store_assets/captures/10-inch
          --dry-run true

name: Deploy Herz der Kabbala dev site

on:
  workflow_dispatch: {}
  push:
    branches: ["herz-der-kabbala-dev"]
    paths:
      - "herz-der-kabbala/**"
      - ".github/workflows/deploy-herz-der-kabbala-dev.yml"

permissions:
  contents: read

concurrency:
  group: herz-der-kabbala-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate deployment files
        run: |
          test -f herz-der-kabbala/dist/index.html
          test -f herz-der-kabbala/dist/_headers
          test -f herz-der-kabbala/dist/robots.txt

      - name: Create Cloudflare Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx -y wrangler@4 pages project create herz-der-kabbala-dev --production-branch=herz-der-kabbala-dev || true

      - name: Deploy preview site
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: herz-der-kabbala
          command: pages deploy dist --project-name=herz-der-kabbala-dev --branch=herz-der-kabbala-dev

      - name: Verify deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --location --retry 5 --retry-all-errors "$DEPLOYMENT_URL/" >/dev/null
          curl --fail --location --retry 5 --retry-all-errors "$DEPLOYMENT_URL/de/" >/dev/null
          echo "Deployment URL: $DEPLOYMENT_URL"

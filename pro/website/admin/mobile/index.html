<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>DownloadThat Admin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11101b;
      --card: #1b1930;
      --border: #34304e;
      --text: #fff;
      --muted: #bdb7d0;
      --accent: #ff806f;
      --good: #4adfb6;
      --danger: #ff7272;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 18px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 22px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; margin: 0 0 7px; font-weight: 700; }
    input, button {
      width: 100%;
      min-height: 50px;
      border-radius: 11px;
      font: inherit;
    }
    input {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: #121020;
      color: var(--text);
      padding: 12px 14px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      border: 0;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent);
      color: #16121c;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { color: var(--muted); font-size: .9rem; margin-top: -8px; margin-bottom: 16px; }
    .status { min-height: 24px; margin-top: 12px; }
    .status.error { color: var(--danger); }
    .result { display: none; }
    .result.visible { display: block; }
    code {
      display: block;
      overflow-wrap: anywhere;
      background: #0e0d17;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0 14px;
      font-size: .95rem;
      user-select: all;
    }
    .meta { color: var(--muted); font-size: .9rem; }
    .ok { color: var(--good); }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>DownloadThat Admin</h1>
    <p class="lead">Mobile Testlizenz erstellen. Maximal 14 Tage.</p>

    <section class="card">
      <form id="grant-form" autocomplete="off">
        <label for="label">Für wen?</label>
        <input id="label" name="label" maxlength="120" required placeholder="z. B. Michele" autocomplete="off" />

        <label for="days">Gültigkeit in Tagen</label>
        <input id="days" name="days" type="number" inputmode="numeric" min="1" max="14" value="14" required />
        <div class="hint">Standard: 14 Tage. Server-Hardlimit: 14 Tage.</div>

        <button id="create-button" type="submit">Testlizenz erstellen</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section id="result" class="card result" aria-live="polite">
      <div class="ok"><strong>Lizenz erstellt</strong></div>
      <code id="license-key"></code>
      <div id="license-meta" class="meta"></div>
      <div class="row" style="margin-top:14px">
        <button id="copy-button" type="button">Kopieren</button>
        <button id="share-button" class="secondary" type="button">Teilen</button>
      </div>
    </section>
  </main>
  <script src="/admin/mobile/mobile-admin.js" defer></script>
</body>
</html>
